id = "kiro"
version = "2026.10.10.1"
min_engine_version = 2
updated_at = "2026-10-10T00:00:00Z"
aliases = ["kiro-cli"]

[[rules]]
id = "live_prompt_idle"
state = "idle"
priority = 1100
region = "bottom_non_empty_lines(4)"
visible_idle = true
line_regex = ['(?i)^\s*[>›]\s*ask a question or describe a task(?:\s+(?:enter|↵))?\s*$']

[[rules]]
id = "tool_approval"
state = "blocked"
priority = 1050
region = "bottom_non_empty_lines(8)"
visible_blocker = true
any = [
  { all = [
    { regex = ['(?is)(?:^|\n)\s*esc\s+to\s+close\b(?:[^\n]*\bto\s+navigate\b[^\n]*|.*\bto\s+navigate\b.*\bto\s+select\b.*\btab\s+to\s+edit|[^\n]*\benter\s+to\s+see\s+more\s+options)\s*\z'] },
    { any = [
      { line_regex = [
        '(?i)^\s*[>❯]\s*(?:allow|always allow|deny|always deny)\s*$',
        '(?i)^\s*(?:[>❯]\s*)?allow\s*$',
        '(?i)^\s*(?:[>❯]\s*)?always allow\s*$',
        '(?i)^\s*(?:[>❯]\s*)?deny\s*$',
        '(?i)^\s*(?:[>❯]\s*)?always deny\s*$',
      ] },
      { line_regex = [
        '(?i)^\s*[>❯]\s*(?:yes, single permission|trust, always allow in this session|no \(tab to edit\))\s*$',
        '(?i)^\s*(?:[>❯]\s*)?yes, single permission\s*$',
        '(?i)^\s*(?:[>❯]\s*)?trust, always allow in this session\s*$',
        '(?i)^\s*(?:[>❯]\s*)?no \(tab to edit\)\s*$',
      ] },
      { line_regex = [
        '(?i)^\s*[>❯]\s*(?:trust\b.*|entire tool)\s*$',
        '(?i)^\s*(?:[>❯]\s*)?(?:trust )?entire tool(?:\s+\([^\n]*\))?(?:\s+(?:session|workspace|always))?\s*$',
      ] },
    ] },
  ] },
]

[[rules]]
id = "tool_approval_edit"
state = "blocked"
priority = 1045
region = "whole_recent"
visible_blocker = true
regex = ['(?im)(?:^|\n)[ \t]*[-─]+[ \t]*\n[^\n]*requires\s+approval\s*[·.]\s*modify\s+request[ \t]*\n(?:[ \t]*\n|[^\n]*[^\s─-][^\n]*\n)*?[ \t]*[>›][ \t]*[^\n]*\n(?:[ \t]*\n|[^\n]*[^\s─-][^\n]*\n)*[ \t]*[-─]+[ \t]*\n[ \t]*esc[ \t]+to[ \t]+close[ \t]*\n?\z']

[[rules]]
id = "crew_approval"
state = "blocked"
priority = 1040
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = [
  "tool approval",
  "approve all pending",
  "configure individually (agent monitor)",
  "exit (cancel subagents)",
]

[[rules]]
id = "question_panel"
state = "blocked"
priority = 1030
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["to navigate", "to submit", "esc to cancel"]

[[rules]]
id = "sessions_picker"
state = "unknown"
priority = 1020
region = "bottom_non_empty_lines(8)"
skip_state_update = true
# The /sessions resume dashboard is a navigable list, not a live prompt or an
# approval. It shows list-navigation controls without the approval footer
# ("esc to close" + Allow/Deny) or a submit/cancel prompt, so prior state must
# be preserved rather than reclassified. Gate on the picker's own controls and
# exclude the approval shape so a real tool-approval still wins on priority.
all = [
  { contains = ["↑↓ to navigate", "to select"] },
  { any = [
    { contains = ["ctrl+p to preview"] },
    { contains = ["to view all controls"] },
    { contains = ["tab to switch"] },
  ] },
]
not = [
  { contains = ["requires approval"] },
  { contains = ["esc to cancel"] },
]

[[rules]]
id = "live_working_footer"
state = "working"
priority = 950
region = "bottom_non_empty_lines(4)"
visible_working = true
contains = ["kiro is working", "type to steer", "ctrl+s to queue"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 900
region = "osc_title"
visible_working = true
regex = ['(?i)^[◐◓◑◒/|\\-]\s+kiro:']

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 890
region = "osc_progress"
visible_working = true
regex = ['^4;3;?$']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 120
region = "osc_progress"
visible_idle = true
# Kiro v3 drives the OSC progress sequence: 4;3 while a turn runs, 4;0 when the
# turn is done and the prompt is idle (verified against kiro-cli 2.29.0). Unlike
# the on-screen prompt line, the progress sequence is not viewport text, so it
# still reports idle after the user scrolls. Lower priority than every live
# working/blocked rule so an in-progress or approval frame always wins.
regex = ['^4;0']
